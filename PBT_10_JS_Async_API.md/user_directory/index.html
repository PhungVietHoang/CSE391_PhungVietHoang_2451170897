<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Directory</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>User Directory</h1>
        <div class="top-actions">
          <input
            id="search-input"
            type="search"
            placeholder="Tìm theo tên hoặc email"
          />
          <button id="refresh-button">Làm mới</button>
        </div>
      </header>

      <section class="form-card">
        <h2 id="form-title">Thêm user mới</h2>
        <form id="user-form">
          <div class="fields">
            <label>
              Name
              <input id="name-input" type="text" required />
            </label>
            <label>
              Email
              <input id="email-input" type="email" required />
            </label>
            <label>
              Phone
              <input id="phone-input" type="text" />
            </label>
          </div>
          <div class="actions">
            <button type="submit">Lưu</button>
            <button id="cancel-button" type="button" class="secondary hidden">
              Hủy
            </button>
          </div>
        </form>
      </section>

      <div id="status" class="status"></div>

      <section id="users-section" class="users-section"></section>
    </div>

    <script src="app.js"></script>
  </body>
</html>
