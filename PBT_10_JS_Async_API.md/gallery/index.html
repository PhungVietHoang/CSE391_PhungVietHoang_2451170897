<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Scroll Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="gallery-shell">
      <header>
        <h1>Infinite Scroll Gallery</h1>
        <p>Cuộn xuống để tải thêm ảnh từ JSONPlaceholder Photos.</p>
      </header>

      <main>
        <div id="photo-grid" class="photo-grid"></div>
        <div id="load-status" class="load-status">Đang chờ tải ảnh...</div>
        <div id="load-trigger"></div>
      </main>
    </div>

    <div id="lightbox" class="lightbox hidden">
      <button id="lightbox-close" class="lightbox-close">×</button>
      <img id="lightbox-image" alt="Photo" />
    </div>

    <script src="app.js"></script>
  </body>
</html>
