<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuyên Nghiệp Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="todo-container">
      <header>
        <h1>Todos</h1>
      </header>

      <main class="todo-box">
        <form id="todoForm">
          <input
            type="text"
            id="todoInput"
            placeholder="Bạn cần làm gì tiếp theo?"
            autocomplete="off"
          />
        </form>

        <ul id="todoList"></ul>

        <footer class="todo-footer" id="todoFooter">
          <span class="todo-count" id="todoCount">0 items left</span>
          <div class="todo-filters" id="todoFilters">
            <button data-filter="all" class="filter-btn active">All</button>
            <button data-filter="active" class="filter-btn">Active</button>
            <button data-filter="completed" class="filter-btn">
              Completed
            </button>
          </div>
          <button id="clearCompletedBtn" class="clear-completed">
            Clear completed
          </button>
        </footer>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
